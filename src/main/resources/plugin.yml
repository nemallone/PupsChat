name: PupsChat
version: '${version}'
main: nemallone.bworld.chat.PupsChat
api-version: '1.21'
description: Настраиваемый чат и автоматическая модерация для Paper
authors: [bworld, nemallone]
website: https://github.com/nemallone/PupsChat
softdepend: [PremiumVanish, Essentials, PlaceholderAPI, StrikePractice]
libraries:
  - org.jetbrains.kotlin:kotlin-stdlib:2.1.20
commands:
  pupschat:
    description: Управление PupsChat и просмотр логов
    usage: /pupschat (reload/logs/ai)
    aliases: [pchat]
  mentions:
    description: Переключение уведомлений об упоминаниях
  automessage:
    description: Переключение сообщения после боя
  chathide:
    description: Переключение видимости чата
  localspy:
    description: Просмотр локальных сообщений вне радиуса чата
    usage: /localspy
  unmutef:
    description: Снятие мута, выданного фильтром
    usage: /unmutef <игрок>
  acb:
    description: Отправка сообщения в action bar
    usage: /acb (ник|@a) <сообщение>

permissions:
  pupschat.admin:
    default: op
    children:
      pupschat.unmutef: true
      pupschat.logs.view: true
      pupschat.logs.clear: true
      pupschat.logs.staff: true
      pupschat.staff: true
      pupschat.localspy: true
      pupschat.format.*: true
  pupschat.staff:
    default: op
    children:
      pupschat.staff.send: true
      pupschat.staff.read: true
  pupschat.staff.send:
    default: op
  pupschat.staff.read:
    default: op
  pupschat.localspy:
    default: op
  pupschat.format.*:
    default: op
    children:
      pupschat.format.color: true
      pupschat.format.hex: true
      pupschat.format.bold: true
      pupschat.format.italic: true
      pupschat.format.underline: true
      pupschat.format.strikethrough: true
      pupschat.format.obfuscated: true
      pupschat.format.reset: true
  pupschat.format.color:
    default: false
  pupschat.format.hex:
    default: false
  pupschat.format.bold:
    default: false
  pupschat.format.italic:
    default: false
  pupschat.format.underline:
    default: false
  pupschat.format.strikethrough:
    default: false
  pupschat.format.obfuscated:
    default: false
  pupschat.format.reset:
    default: false
  pupschat.logs.staff:
    default: op
  pupschat.bypass.ai:
    default: false
  pupschat.logs.view:
    default: op
  pupschat.logs.clear:
    default: op
  pupschat.unmutef:
    default: op
  pupschat.mentions:
    default: true
  pupschat.chat:
    default: true
  pupschat.acb:
    default: op
  pupschat.globalmentions:
    default: op
  pupschat.bypass.*:
    default: op
    children:
      pupschat.bypass.caps: true
      pupschat.bypass.characters: true
      pupschat.bypass.spam: true
      pupschat.bypass.ads: true
      pupschat.bypass.words: true
      pupschat.bypass.symbols: true
      pupschat.bypass.flood: true
      pupschat.bypass.playtime: true
      pupschat.bypass.randomchars: true
      pupschat.bypass.toxicity: true
      pupschat.bypass.mute: true
      pupschat.bypass.announcements: true
  pupschat.alerts:
    default: op
  pupschat.automessage:
    default: true
