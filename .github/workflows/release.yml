name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify release version
        shell: bash
        run: |
          project_version="$(./gradlew properties --console=plain -q | sed -n 's/^version: //p')"
          if [[ "$GITHUB_REF_NAME" != "v$project_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $project_version"
            exit 1
          fi

      - name: Build
        run: ./gradlew clean build

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/libs/PupsChat-*.jar
